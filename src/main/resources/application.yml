spring:

  application:
    name: clustered-data-warehouse


  jpa:
    open-in-view: false
    hibernate:

      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  docker:
    compose:

      lifecycle-management: start-and-stop


  datasource:

    driver-class-name: org.postgresql.Driver


  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB



logging:
  level:

    com.example.demo: INFO


    com.example.demo.Validator: DEBUG
    com.example.demo.Services: DEBUG


    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE