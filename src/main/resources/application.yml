spring:
  # 1. APPLICATION METADATA
  application:
    name: clustered-data-warehouse

  # 2. JPA & HIBERNATE CONFIGURATION
  jpa:
    open-in-view: false # Recommended to prevent lazy-loading issues outside the transaction boundary
    hibernate:
      # CRITICAL: Ensures tables (fx_deals) are created based on your @Entity (Deal.java)
      # on application startup. Change to 'update' or 'none' for production.
      ddl-auto: update
    show-sql: true # Logs all executed SQL queries to the console
    properties:
      hibernate:
        format_sql: true

  # 3. DOCKER COMPOSE INTEGRATION (For connecting to your PostgreSQL container)
  docker:
    compose:
      # Tells Spring to automatically start and stop the services defined in docker-compose.yml
      lifecycle-management: start-and-stop

  # 4. DATASOURCE CONFIGURATION (Usually auto-configured by Docker Compose, but defining
  # the driver is good practice)
  datasource:
    # Docker Compose integration automatically uses the user/password/db defined in the YAML file
    driver-class-name: org.postgresql.Driver

  # 5. WEB SERVER CONFIGURATION
  web:
    resources:
      add-mappings: false # Disable default resource mappings
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 6. LOGGING CONFIGURATION
# If you are using the logback-spring.xml file, this section controls the logging levels.
logging:
  level:
    # Set the overall application logging to INFO
    com.example.demo: INFO

    # Set specific packages to DEBUG to see detailed processing/validation steps
    com.example.demo.Validator: DEBUG
    com.example.demo.Services: DEBUG

    # Suppress verbose Spring/Hibernate messages
    org.springframework: INFO
    org.hibernate.SQL: DEBUG # Show generated SQL queries (only if show-sql: false)
    org.hibernate.orm.jdbc.bind: TRACE # Show SQL parameter bindings (if needed for deep debug)