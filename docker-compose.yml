version: '3.8'
services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      # These variables are automatically picked up by Spring Boot
      # via the Docker Compose dependency and configured in your app.
      POSTGRES_DB: progresssoft            # Database name
      POSTGRES_USER: postgres             # Database user
      POSTGRES_PASSWORD: mohamed@1230     # Database password
    ports:
      # Exposes the DB port so you can connect to it externally (optional but helpful)
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5